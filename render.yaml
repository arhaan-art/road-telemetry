services:
  - type: web
    name: road-telemetry
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RT_SECRET
        generateValue: true
      - key: RT_DB_PATH
        value: /tmp/rt.db
